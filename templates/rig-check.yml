# The rig required check. Copy to .github/workflows/ and make "rig-check" a required status check.
# sensors.json `fixtures` lists files that intentionally contain detector patterns (skipped by pattern sensors only); adding to it needs human approval.
# The workflow file itself is judged from the PR's copy (pull_request), so protect it with CODEOWNERS plus "Require review from Code Owners".
# The checker and its config come from the BASE branch, so a PR cannot loosen the rules it is judged by.
# ai-review runs on every PR from this repository (fork PRs have no secrets, so it is skipped there and a person reviews): a clean-context code review and a
# security review, each briefed from the BASE branch, failing on a critical or high item under ## Findings (## Pre-existing never fails it). Make "ai-review"
# a required status check too. rig-check prints each PR's risk tier; with risk.enforce in the base .rig/sensors.json it requires one approval from someone
# other than the author on every PR. Two reviewers for tier 2 or risky paths is a branch-protection or ruleset setting (with CODEOWNERS), never this workflow.
# Lead override (off unless .rig/sensors.json on the base branch lists you under humanApproval.selfApprovers): label the PR rig-lead-override. The
# lead-override job then waits for the required reviewer of the rig-lead-override Environment
# (Settings > Environments: add the lead as required reviewer and leave "prevent self-review" off; rig-check reads GitHub's record of that approval, so an Environment without a reviewer never passes). rig-check accepts the PR's approval rows only when both jobs succeeded on the head commit.
name: rig-check
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group: # the merge queue re-runs the sensors on main with the change applied; approvals were checked on the PR
permissions:
  contents: read
  pull-requests: read # lets CI verify an independent approving review when a PR adds approval or waiver rows
  actions: read # lets CI read this run's ai-review and lead-override jobs
jobs:
  ai-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm install -g @anthropic-ai/claude-code
      - name: Review the diff with a clean context
        env:
          BASE: ${{ github.base_ref }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          # the team's rules come from the base branch, so the PR cannot soften what it is reviewed against
          git show "origin/$BASE:REVIEW.md" > "$RUNNER_TEMP/brief.md" 2>/dev/null || echo "Review this diff for correctness bugs, broken contracts, data loss and missing tests." > "$RUNNER_TEMP/brief.md"
          git diff "origin/$BASE...HEAD" > "$RUNNER_TEMP/change.diff"
          claude -p --model sonnet --allowedTools "Read,Grep,Glob" "$(cat "$RUNNER_TEMP/brief.md")

          Security is reviewed separately: skip it. The change to review is the diff in $RUNNER_TEMP/change.diff (read it, and the files it touches). Answer in exactly this shape: a line 'verdict: pass | changes-needed', then '## Findings' with '- [severity: critical|high|medium] path:line: problem → fix' lines, then '## Pre-existing' with '- path:line: problem → fix' lines. Report a finding only with the file, line and the input where it goes wrong; a line the diff did not add or change goes under ## Pre-existing. Pre-existing items never change the verdict: it is changes-needed only when ## Findings has an item." | tee "$RUNNER_TEMP/review.md"
      - name: Review the diff for security
        env:
          BASE: ${{ github.base_ref }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          git show "origin/$BASE:.rig/security-brief.md" > "$RUNNER_TEMP/security-brief.md" 2>/dev/null || echo "Review this diff for security only: injection, authn/authz, secrets, unsafe input, crypto, path traversal, and every action in .rig/product/architecture.md ## Access the change touches against its row: each allowed role enforced, every other role refused, on each interface. Edit nothing." > "$RUNNER_TEMP/security-brief.md"
          claude -p --model sonnet --allowedTools "Read,Grep,Glob" "$(cat "$RUNNER_TEMP/security-brief.md")

          The change to review is the diff in $RUNNER_TEMP/change.diff (read it, and the files it touches). Answer in exactly this shape: a line 'verdict: pass | changes-needed', then '## Findings' with '- [severity: critical|high|medium] path:line: problem → fix' lines, then '## Pre-existing' with '- path:line: problem → fix' lines. Report a finding only with the file, line and the input where it goes wrong; a line the diff did not add or change goes under ## Pre-existing. Pre-existing items never change the verdict: it is changes-needed only when ## Findings has an item." | tee "$RUNNER_TEMP/security.md"
      - name: Gate on both reviews
        if: ${{ !cancelled() }}
        run: |
          # only a critical or high item under ## Findings fails the job: ## Pre-existing stood before this change, and a medium finding is for the person
          gate() {
            if [ ! -s "$1" ] || ! grep -qE '^verdict: ' "$1"; then echo "::error::the $2 gave no verdict line (did claude run? check CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY)"; return 1; fi
            if awk '/^## /{f=($0 ~ /^## Findings/)} f' "$1" | grep -qE '\[severity: (critical|high)\]'; then echo "::error::the $2 reported critical or high findings"; return 1; fi
          }
          ok=0
          gate "$RUNNER_TEMP/review.md" "AI review" || ok=1
          gate "$RUNNER_TEMP/security.md" "security review" || ok=1
          exit $ok
  lead-override:
    needs: ai-review
    if: contains(github.event.pull_request.labels.*.name, 'rig-lead-override')
    runs-on: ubuntu-latest
    environment: rig-lead-override # the required reviewer's click in the GitHub web UI is the human decision
    steps:
      - run: echo "lead override approved for ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
  rig-check:
    needs: [ai-review, lead-override]
    if: ${{ !cancelled() }} # runs whatever the review jobs did: ai-review is its own required check, lead-override is skipped without the label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: Load the checker and config from the base branch
        env:
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
        run: |
          base="origin/${BASE#refs/heads/}"
          mkdir -p "$RUNNER_TEMP/sdlc"
          if git cat-file -e "$base:.rig/bin/sdlc.ts" 2>/dev/null; then
            git ls-tree --name-only "$base" .rig/bin/ | while IFS= read -r f; do git show "$base:$f" > "$RUNNER_TEMP/sdlc/$(basename "$f")"; done
          else
            echo "::notice::bootstrap: no sdlc checker on $base yet; using this PR's copy. This PR needs human review."
            if [ ! -f .rig/bin/sdlc.ts ]; then echo "::error::run sdlc.ts vendor and commit .rig/bin"; exit 1; fi
            cp .rig/bin/* "$RUNNER_TEMP/sdlc/"
          fi
          git show "$base:.rig/sensors.json" > "$RUNNER_TEMP/sensors.json" 2>/dev/null || cp .rig/sensors.json "$RUNNER_TEMP/sensors.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/sensors.json"
      - name: Check out consumer repos
        env:
          TOKEN: ${{ secrets.SDLC_CONSUMERS_TOKEN }}
        run: |
          node -e 'for (const c of (JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).consumers || [])) if (c.repo) console.log(c.repo + " " + c.path)' "$RUNNER_TEMP/sensors.json" |
          while read -r repo dir; do
            if [ -z "$TOKEN" ]; then echo "::error::consumer $repo needs the SDLC_CONSUMERS_TOKEN secret (contents:read)"; exit 1; fi
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\n')" clone --depth 1 "https://github.com/${repo}.git" "$dir"
          done
      - name: sdlc check
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
          BASE: ${{ github.base_ref || github.event.merge_group.base_ref }}
          GH_TOKEN: ${{ github.token }}
        run: node --disable-warning=ExperimentalWarning "$RUNNER_TEMP/sdlc/sdlc.ts" check --at ci --base "origin/${BASE#refs/heads/}" --config-from "origin/${BASE#refs/heads/}"
      - name: Wiki staleness (warning only)
        continue-on-error: true
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: node --disable-warning=ExperimentalWarning "$RUNNER_TEMP/sdlc/sdlc.ts" wiki status | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lessons check
        env:
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          if grep -q "learn: args" "$RUNNER_TEMP/sdlc/sdlc.ts"; then node --disable-warning=ExperimentalWarning "$RUNNER_TEMP/sdlc/sdlc.ts" learn check; else echo "::notice::the base checker predates the learn command; skipping the lessons check"; fi
