# Evals for rig itself (harness readiness 3.2). A push to main that touches rig's own files runs the dry evals at $0 (ci.yml already runs them on pull
# requests); the live paired eval runs nightly and on demand, costs real money, and is capped. It never runs on a pull request: it holds a secret.
# The gate fails the run when an arm's accepted rate or dollars per accepted task is worse than eval/baseline.json; an arm with no baseline is listed as not enforced.
name: eval
on:
  push:
    branches: [main]
    paths: ['CLAUDE.md', '.claude/**', 'skills/**', 'agents/**', 'templates/**', 'scripts/**', 'eval/**', 'tests/e2e/**']
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci || npm install
      - run: npm run eval:dry
      - run: npm run eval:review:dry
      - run: npm run eval:app:dry
      - run: npm run eval:ablate:dry
  live:
    if: github.event_name != 'push'
    needs: dry
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci || npm install
      - run: npm install -g @anthropic-ai/claude-code
      - name: Paired eval (costs money; capped at 15 dollars)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node eval/run.mjs --variant links --arms haiku-bare,haiku-rig --runs 3 --cap-run 4 --cap-total 15 --results "$RUNNER_TEMP/paired.jsonl"
      - name: Regression gate
        run: node eval/gate.mjs "$RUNNER_TEMP/paired.jsonl" --variant links | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-eval
          path: ${{ runner.temp }}/paired.jsonl
