name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: node --disable-warning=ExperimentalWarning --test scripts/*.spec.ts
  e2e-fast:
    # The e2e unit tests and the scripted acceptance flow (a fake model, $0): install, brief, two changes through approval,
    # verify and PR (with the contract stage and an HTTP acceptance), the deploy gate and the policy stage. The real-model run is `npm run test:e2e`, by a person.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: npm ci || npm install
      - run: npm run test:e2e:unit
      - run: npm run test:e2e:fast
      # two instances in two worktrees at once, scripted model, $0: do they interfere
      - run: npm run test:e2e:parallel
      # the eval pipeline replayed from fixtures at $0; live evals are run by a person (spec §9)
      - run: npm run eval:dry
        if: matrix.os == 'ubuntu-latest'
      - run: npm run eval:review:dry
        if: matrix.os == 'ubuntu-latest'
      - run: npm run eval:app:dry
        if: matrix.os == 'ubuntu-latest'
      # the ablate dry run is eval/ablation.test.mjs, already run by test:e2e:unit above
  e2e-stacks:
    # Stack fixtures: each pack onboards a tiny repo and check --at commit blocks a broken edit on its core sensor.
    # Every toolchain is installed explicitly and --require all fails the job if one still cannot run: no silent skips here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci || npm install
      # every pack's sast sensor runs Semgrep at commit, and CI=true makes a missing Semgrep block
      - run: pipx install semgrep==1.182.1
      - run: npm run test:e2e:stacks -- --require all
